spring.application.name=backend
server.port=8080

# H2 (ファイル永続化)
spring.datasource.url=jdbc:h2:file:./data/appdb;MODE=LEGACY
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# 外部API接続設定(BFFで一元管理)
external.api.base-url=http://localhost:9090
external.api.connect-timeout-millis=3000
external.api.read-timeout-millis=10000
external.api.max-retries=2

# セッション
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
